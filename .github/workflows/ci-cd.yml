name: FITBEST CI/CD

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: fitbest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fitbest
          POSTGRES_USER: fitbest
          POSTGRES_PASSWORD: fitbest-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitbest -d fitbest"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '*/package-lock.json'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: fitbest-server/pom.xml
      - name: Test deployment safeguards
        run: python3 fitbest-server/deploy/test_github_actions_deploy.py
      - name: Build web bundle and run Vitest
        run: |
          for app in fit-best-trainer hyrox-trainer btwe-trainer fit-best-admin; do
            npm --prefix "$app" ci --no-audit --no-fund
          done
          npm --prefix fit-best-trainer test
          npm --prefix fit-best-trainer test -- --mode hd tests/pwa-layout.test.tsx
          node fitbest-server/deploy/build-web.mjs "$RUNNER_TEMP/fitbest-web"
      - name: Test admin password manager integration
        working-directory: fit-best-admin
        run: |
          npx playwright install --with-deps firefox
          npm test
      - name: Verify server and browser client integration
        working-directory: fitbest-server
        env:
          FITBEST_SYNC_PG_URL: jdbc:postgresql://127.0.0.1:5432/fitbest?stringtype=unspecified
          FITBEST_SYNC_PG_USER: fitbest
          FITBEST_SYNC_PG_PASSWORD: fitbest-ci
          FITBEST_FEEDBACK_REDIS_URL: redis://127.0.0.1:6379
          FITBEST_SYNC_RUN_CLIENT: 'true'
          FITBEST_SYNC_WEB_ROOT: ${{ runner.temp }}/fitbest-web
        run: mvn --batch-mode --no-transfer-progress verify

  publish:
    name: Publish containers
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      server_digest: ${{ steps.push.outputs.server_digest }}
      web_digest: ${{ steps.push.outputs.web_digest }}
    env:
      FITBEST_IMAGE_NAMESPACE: ghcr.io/${{ github.repository }}
      FITBEST_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('sha-{0}', github.sha) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build deployable images
        run: |
          docker build --file fitbest-server/Dockerfile \
            --build-arg MAVEN_IMAGE=maven:3.9-eclipse-temurin-21 \
            --build-arg JAVA_IMAGE=eclipse-temurin:21-jre \
            --build-arg MAVEN_MIRROR_URL=https://repo.maven.apache.org/maven2 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "${FITBEST_IMAGE_NAMESPACE}-server:${FITBEST_RELEASE_TAG}" fitbest-server
          docker build --file fitbest-server/Dockerfile.web \
            --build-arg NODE_IMAGE=node:24-bookworm-slim \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "${FITBEST_IMAGE_NAMESPACE}-web:${FITBEST_RELEASE_TAG}" .
      - name: Smoke test the release with Docker Compose
        working-directory: fitbest-server
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.release.yml:docker-compose.registry.yml
          FITBEST_POSTGRES_IMAGE: postgres:16-alpine
          FITBEST_REDIS_IMAGE: redis:7-alpine
        run: |
          printf '%s\n' NODE_ENV=development HOST_PORT=18080 POSTGRES_PASSWORD=fitbest-ci > .env
          trap 'docker compose logs --tail=100' ERR
          docker compose up --no-build --wait --wait-timeout 120
          for path in actuator/health fitbest/ fitbest-hd/ fit-best/ hyrox/ hyrox/HD/ btwe/ btwe/HD/ fitbestwebsite/ console/; do
            curl --fail --silent --show-error "http://127.0.0.1:18080/$path" > /dev/null
          done
          [[ $(curl --fail --silent --show-error --range 0-15 --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18080/console/media/rowing-pov.mp4) == 206 ]]
      - name: Push images to GHCR
        id: push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for image in server web; do
            digest=$(docker push "${FITBEST_IMAGE_NAMESPACE}-$image:${FITBEST_RELEASE_TAG}" |
              tee /dev/stderr | awk '$2 == "digest:" { digest = $3 } END { print digest }')
            [[ $digest =~ ^sha256:[a-f0-9]{64}$ ]]
            printf '%s_digest=%s\n' "$image" "$digest" >> "$GITHUB_OUTPUT"
          done

  deploy:
    name: Deploy production
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_COMPOSE_PROJECT: ${{ vars.DEPLOY_COMPOSE_PROJECT }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      FITBEST_PRODUCTION_ENV: ${{ secrets.FITBEST_PRODUCTION_ENV }}
      FITBEST_IMAGE_NAMESPACE: ghcr.io/${{ github.repository }}
      FITBEST_RELEASE_TAG: sha-${{ github.sha }}
      FITBEST_SERVER_DIGEST: ${{ needs.publish.outputs.server_digest }}
      FITBEST_WEB_DIGEST: ${{ needs.publish.outputs.web_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull verified release and deploy
        run: bash fitbest-server/deploy/github-actions-deploy.sh
