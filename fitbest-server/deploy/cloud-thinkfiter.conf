# FITBEST 生产入口（cloud.thinkfiter.com）+ irox（api.thinkfiter.com，保持原样）
# 由 fitbest 部署生成；历史备份见 irox-production-http.conf.bak-before-fitbest-*

# 80 → 443（保留 ACME 续期路径）
server {
    listen 80;
    server_name api.thinkfiter.com cloud.thinkfiter.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/irox-acme; }
    location / { return 301 https://$host$request_uri; }
}

# irox API（未改动）
server {
    listen 443 ssl;
    server_name api.thinkfiter.com;
    ssl_certificate /etc/letsencrypt/live/irox-production/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/irox-production/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://127.0.0.1:18880;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# FITBEST 统一服务
server {
    listen 443 ssl;
    server_name cloud.thinkfiter.com;
    ssl_certificate /etc/letsencrypt/live/irox-production/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/irox-production/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /fit-best/api/v1/feedback {
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:9090/api/v1/feedback;
        proxy_set_header Host $host;
        proxy_set_header X-Fitbest-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/v1/feedback {
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:9090/api/v1/feedback;
        proxy_set_header Host $host;
        proxy_set_header X-Fitbest-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # API：/fit-best/api/* → 统一服务 /api/*（去前缀；hyrox/btwe/admin/trainer 前端的固定 base）
    location ^~ /fit-best/api/ {
        proxy_pass http://127.0.0.1:9090/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 其余全部（静态站 + 直连 API 路径 /api/v1、/s、/actuator）
    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
