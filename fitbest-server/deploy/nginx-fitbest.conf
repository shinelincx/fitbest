# FITBEST 统一入口 · 阶段二配置（demo.thinkfit.cn）
#
# 阶段二起全部流量（API + 分享 + 静态站）由 fitbest-server 承接。
#
# 部署步骤：
#   1. 在 fitbest-server/ 目录：cp .env.example .env（改密钥/密码）→ docker compose up -d --build
#   2. 将 nginx 容器接入网络：docker network connect fitbest-net <nginx容器名>
#   3. 用本文件替换原分散配置后：nginx -t && nginx -s reload
#
# 灰度回退：若需临时回退 API 到旧 NestJS，将下方 /fit-best/api/ 块的
#   proxy_pass 目标改回 http://fitbest-api:3000/api/ 并 reload 即可（30 秒内完成）。
#   前提：旧 fitbest-api 容器仍在 pcba-net 运行。

# ---------- 反馈上传 ----------
location = /fit-best/api/v1/feedback {
    client_max_body_size 16m;
    proxy_pass http://fitbest-server:8080/api/v1/feedback;
    proxy_set_header Host $host;
    proxy_set_header X-Fitbest-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /api/v1/feedback {
    client_max_body_size 16m;
    proxy_pass http://fitbest-server:8080/api/v1/feedback;
    proxy_set_header Host $host;
    proxy_set_header X-Fitbest-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ---------- API：统一服务承接（如需灰度回退见文件头说明） ----------
location ^~ /fit-best/api/ {
    proxy_pass http://fitbest-server:8080/api/;   # 去掉 /fit-best 前缀
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ---------- 分享短链（服务端渲染 + OG） ----------
location ^~ /s/ {
    proxy_pass http://fitbest-server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ---------- 其余全部：统一服务静态托管 + API ----------
#  /fitbest/  /fitbest-hd/  /fit-best/  /hyrox/  /btwe/  /fitbestwebsite/  /console/
location / {
    proxy_pass http://fitbest-server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 静态资源 gzip（html/js/css/json/svg）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;
}
