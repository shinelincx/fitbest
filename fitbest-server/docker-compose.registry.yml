services:
  fitbest-server:
    image: ${FITBEST_IMAGE_NAMESPACE:-ghcr.io/shinelincx/fitbest}-server:${FITBEST_RELEASE_TAG:?Set FITBEST_RELEASE_TAG}
  web-bundle:
    image: ${FITBEST_IMAGE_NAMESPACE:-ghcr.io/shinelincx/fitbest}-web:${FITBEST_RELEASE_TAG:?Set FITBEST_RELEASE_TAG}
  postgres:
    image: ${FITBEST_POSTGRES_IMAGE:-postgres:16-alpine}
  redis:
    image: ${FITBEST_REDIS_IMAGE:-redis:7-alpine}
