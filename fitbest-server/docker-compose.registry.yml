services:
  fitbest-server:
    image: ${FITBEST_IMAGE_NAMESPACE:-ghcr.io/shinelincx/fitbest}-server:${FITBEST_RELEASE_TAG:?Set FITBEST_RELEASE_TAG}
    environment:
      FITBEST_DEVICE_LOGIN_TRUSTED_PROXIES: "${FITBEST_DEVICE_LOGIN_TRUSTED_PROXIES:-${FITBEST_DEPLOY_PROXY_GATEWAY:-}}"
  web-bundle:
    image: ${FITBEST_IMAGE_NAMESPACE:-ghcr.io/shinelincx/fitbest}-web:${FITBEST_RELEASE_TAG:?Set FITBEST_RELEASE_TAG}
  postgres:
    image: ${FITBEST_POSTGRES_IMAGE:-docker.m.daocloud.io/library/postgres:16-alpine}
  redis:
    image: ${FITBEST_REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7-alpine}
