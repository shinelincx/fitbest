# Nginx: demo.thinkfit.cn/fitbestwebsite → /var/www/fitbest-website
location /fitbestwebsite/ {
    alias /var/www/fitbest-website/;
    index index.html;
    try_files $uri $uri/ /fitbestwebsite/index.html;

    # 缓存静态资源
    location ~* /fitbestwebsite/.*\.(png|jpg|jpeg|gif|ico|svg|css|js|woff2?)$ {
        alias /var/www/fitbest-website/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
